# Named guest-memory states for the input-script commands wait_state / assert_state / log_state
# (src/input_script.h; file format in src/game_state.h). Loaded from the script's own folder, or (for scripts
# kept elsewhere, e.g. tools/review/routes or out/harness/...) from this file, found by walking up from the script.
#
# Every address here comes from the Session 8 task 7 system maps (db/*.json, docs/systems/*.md), which cite the
# generated code / q index for the writers and live --wwe2k14_peek logs for the values. Nothing here was guessed.
# Only entries marked "live" have had their values seen in a run; use log_state (never fails) for the others
# until a run confirms them. Reads are not synchronised with the guest: wait_state holds 2 frames by default.

