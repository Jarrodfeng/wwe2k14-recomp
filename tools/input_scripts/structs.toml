# Typed views of known guest objects (Session 30, #5) for the input-script command `dump_struct NAME [ADDR]`
# (src/structs.h), live `py tools\live\live.py struct NAME [ADDR]`, and the F11 / auto bookmark bundles (every struct
# whose base reads as a non-null pointer is dumped there).
#
# Format: one [Name] section per object.
#   base = "CHAIN"   a states.toml chain whose VALUE is the object's address ("0x8392945C" = the pointer stored at
#                    0x8392945C; "0x839400F8>256>76" = [[[0x839400F8]+256]+76]). dump_struct NAME ADDR uses ADDR instead.
#   meaning / evidence / confidence   the object as a whole (documentation)
#   FIELD = "+OFFSET TYPE | meaning | evidence"   OFFSET decimal or 0x hex; TYPE u8 u16 u32 s8 s16 s32 f32 ptr str
#                    (str = a pointer to ASCII text, up to 64 characters). Every field cites where it comes from:
#                    nothing here is guessed (CLAUDE.md rule 4); "unconfirmed" when only the value was seen.
# Add a struct (or a field) with each finding; states.toml stays the place for single values that routes wait on.

[SmartMenu]
base = "0x8392945C"
meaning = "the main-menu SmartMenu controller: the open list, its cursor and the highlighted item. 0 outside the main-menu system"
evidence = "states.toml smart_menu (db/menu_ui.json g_smart_menu, high; live runs 232/233/239)"
cursor = "+352 u32 | cursor index in the open list | states.toml cursor (db/menu_ui.json SM+352, high); Session 29 scanner ground truth (run 2201)"
menu = "+364 u32 | the open list: 1 main, 2 PLAY, 3 CREATIONS, 4 OPTIONS, 7 next PLAY level, 2000 setup screens | states.toml menu (run 239); 2 / 4 seen live in run 2236 (Session 30)"
target = "+368 u32 | the highlighted item's target: a menu id below 1000, else a code; main menu: PLAY 2, 30 YEARS 1500, UNIVERSE 1497, CREATIONS 3, Xbox Live -1, MY WWE 6, OPTIONS 4 | states.toml target (run 239); main-menu values from the recording of run 2243 (Session 30)"

