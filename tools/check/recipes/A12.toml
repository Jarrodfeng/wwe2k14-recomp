# S106 C2: A12 blood. Sources: docs/research/s106/C2.md 3.1 (log 110; fault side A12.md 1, :50). The route is lane C3's committed copy.
[recipe]
row = "A12"
question = "after bleed 0 3, are Lesnar's face blood items painted (no item skipped for no picture, tex_fail 0) and the blood seen on his brow?"
notes = ["docs/research/s105/A12.md", "docs/research/s105/BLD.md", "docs/research/s105/T1_blood.md"]
preset = "win-amd64-release-off"

[destination]
route = 'tools\input_scripts\scenes\s105_chk_bleed.txt'
data = "userdata_frozen"
settings = "blank"
timeout_s = 600

[run]
alone = false

[[guard]]
name = "verb ran"
line = 'director: bleed slot 0 level 3: ok'
agg = "count"
need = ">= 1"

[[readout]]
name = "host items skipped for no picture"
line = '\[scene\]\[maps\]\[liquid\] .*no_picture (?P<v>\d+)'
after = 'director: bleed slot 0 level 3: ok'
agg = "max"
role = "fault"
specific = true
fault = "> 0"
fixed = "== 0"

[[readout]]
name = "hook picture reads failed"
line = '\[liquid calls .*?tex_fail (?P<v>\d+)'
after = 'director: bleed slot 0 level 3: ok'
agg = "max"
role = "fault"
specific = true
fault = "> 0"
fixed = "== 0"

[[readout]]
name = "handed to the skin"
line = '\[scene\]\[maps\]\[liquid\] .*handed to the skin (?P<v>\d+)'
after = 'director: bleed slot 0 level 3: ok'
agg = "max"
role = "mechanism"
fixed = ">= 1"

[[shots]]
labels = ["bleed_240", "bleed_840", "bleed_1740"]
ask = "Is there red blood on Lesnar's brow or eye?"
fault = "no"
fixed = "yes"
