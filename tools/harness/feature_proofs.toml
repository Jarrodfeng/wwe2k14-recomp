# Session 93 (ideas 4 and 13, SDK branch s93-memo; the line texts are from owned_front_draw.cpp PrintOwnWindow, printed every 600 guest frames only with
# gpu_d3d_typed_memo_reuse or gpu_d3d_typed_repeat on: "[d3d][memo] per frames A-B: typed draws prepared N (reuse on): hits H (P% of draws; epoch fast path F, hashed X, ...), ...").
