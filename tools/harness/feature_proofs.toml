# gpu_d3d_owned_front: a bit mask. Each bit has its own per-window line (the SDK prints them only with that bit on).
[[feature]]
name = "M4a_front_decoder"
cvar = "gpu_d3d_owned_front"
bit = 1
requires = ["d3d_owned"]
proofs = [{ what = "packet items decoded", any = ['\[d3d\]\[front\] frames \d+-\d+: packet items decoded (\d+)'] }]

[[feature]]
name = "M4b_front_draw"
cvar = "gpu_d3d_owned_front"
bit = 2
requires = ["M4a_front_decoder"]
# (Session 92 M4f-B: the shadow compares only draws the OLD path drew - with M4f-A / B typing (nearly) every draw its claim count is 0 in an
# engaged run, so the window line printing is the engagement proof, as for M4c)
proofs = [{ what = "M4b window line, or superseded (every draw typed by M4f-A leaves the shadow nothing to compare: no line)", any = ['\[d3d\]\[front\] M4b frames \d+-\d+: claims \d+', 'M4f-A frames \d+-\d+: token draw items offered \d+, drawn by the typed front end (\d+)'] }]

[[feature]]
name = "M4c_front_bind"
cvar = "gpu_d3d_owned_front"
bit = 4
requires = ["M4b_front_draw"]
# (its counters are 0 in a window with no draw built; the window line printing is the engagement proof)
proofs = [{ what = "M4c window line, or superseded by typed draws (M4f-A)", any = ['\[d3d\]\[front\] M4c frames \d+-\d+', 'M4f-A frames \d+-\d+: token draw items offered \d+, drawn by the typed front end (\d+)'] }]

[[feature]]
name = "M4d_front_memo"
cvar = "gpu_d3d_owned_front"
bit = 8
requires = ["M4c_front_bind"]
proofs = [{ what = "M4d window line, or superseded by typed draws (M4f-A)", any = ['\[d3d\]\[front\] M4d frames \d+-\d+', 'M4f-A frames \d+-\d+: token draw items offered \d+, drawn by the typed front end (\d+)'] }]

[[feature]]
name = "M4e_front_copies"
cvar = "gpu_d3d_owned_front"
bit = 16
requires = ["M4a_front_decoder"]
proofs = [{ what = "clears paired, or superseded (M4f-B owns the clears and types the inline draws: the shadow pairs nothing)", any = ['\[d3d\]\[front\] M4e frames \d+-\d+: clears paired (\d+)', '\[native\]\[pend\] frames \d+-\d+'] }]

[[feature]]
name = "M4f_A_typed_draw"
cvar = "gpu_d3d_owned_front"
bit = 32
# (the typed draw needs the decoder, not the M4b / M4c shadow compares - those may be off or have nothing to compare)
requires = ["M4a_front_decoder"]
proofs = [{ what = "token draws drawn by the typed front end", any = ['\[d3d\]\[front\] M4f-A frames \d+-\d+: token draw items offered \d+, drawn by the typed front end (\d+)'] }]

[[feature]]
name = "M4f_B_typed_kinds"
cvar = "gpu_d3d_owned_front"
bit = 64
requires = ["M4f_A_typed_draw"]
# (Session 92) B1's kinds append to the M4f-A line; B2's pending clears print their own line (only with bits 32 + 64 on). Either
# kind drawn typed proves B1 engaged; the pend line printing proves B2's gate is on (its counters may be 0 in a window without refusals).
proofs = [{ what = "crowd members / cover / bounds rectangles drawn by the typed front end", any = ['M4f-B typed: crowd members (\d+)', 'M4f-B typed: .*cover rectangles (\d+)', 'M4f-B typed: .*bounds rectangles (\d+)'] },
          { what = "pending-clear line (owned clears on)", any = ['\[native\]\[pend\] frames \d+-\d+'] }]

[[feature]]
name = "M4f_C_cut"
cvar = "gpu_d3d_owned_front"
bit = 128
requires = ["M4f_A_typed_draw"]
# (Session 92) The cut latches at the queue's attach only with every entry wired; a NOT-latched line says why. Engaged = the executor ran items.
proofs = [{ what = "items executed by the record decoder (the cut)", any = ['\[d3d\]\[cut\] frames \d+-\d+: executor items (\d+)'] }]

[[feature]]
name = "M4f_C_poison"
cvar = "gpu_d3d_cut_poison"
on = ["true", "1"]
requires = ["M4f_C_cut"]
proofs = [{ what = "register file poisoned at the latch frame", any = ['\[d3d\]\[cut\] register file poisoned'] }]

# Session 93 (idea 14, Android pacing; the SDK lines are from branch s93-pace's vulkan_presenter.cpp, the game lines from
# src\android_pace.h / android_thermal.h - ASSUMED texts until the first phone run: check the regexes against it).
[[feature]]
name = "S93_display_timing"
cvar = "present_display_timing"
on = ["true", "1"]
# "ext present=yes ... cycles per frame=2" proves the extension was enabled and the refresh rate known; the window line's paced
# count proves presents carried a desired time (it is 0 on a display whose rate is no whole multiple of the game's: then the
# "cycles per frame=none" line is the honest outcome, so only the first proof is required)
proofs = [{ what = "VK_GOOGLE_display_timing present, refresh known", any = ['\[pace\] display timing: ext present=yes refresh=[\d.]+ ms cycles per frame=(?:\d+|none)'] }]

[[feature]]
name = "S93_android_thermal"
cvar = "wwe2k14_android_thermal"
on = ["true", "1"]
proofs = [{ what = "thermal headroom read", any = ['\[pace\]\[thermal\] headroom [\d.]+'] }]

[[feature]]
name = "S93_android_pace_gate"
