[[feature]]
name = "S94_record_lean"
cvar = "wwe2k14_d3d_record_lean"
on = ["true", "1"]
proofs = [{ what = "the game-thread record line printed with lean on (with --wwe2k14_d3d_rec_timer=true; without the timer, a default since S94 M1, the D3D-layer stack line stands in)", any = ['\[d3d_owned\] the D3D-layer stack on', '\[d3d\]\[rec\] game-thread record ms/frame avg [0-9.]+ .*record_lean on'] }]

[[feature]]
name = "S94_instance_world"
cvar = "gpu_native_instance_world"
on = ["true", "1"]
proofs = [{ what = "world instancing latched", any = ['\[native\] world instancing on'] }]

[[feature]]
name = "S94_low_ram"
cvar = "wwe2k14_low_ram"
on = ["on"]
proofs = [{ what = "the low-RAM sizes applied", any = ['\[quirks\] low_ram: forced RAM \d+ MB -> frame budget'] }]

[[feature]]
name = "S94_shared_memory_direct"
cvar = "vulkan_shared_memory_direct"
on = ["1", "2", "-1"]
proofs = [{ what = "direct uploads initialised (mode 1 count-only or 2 mapped)", any = ['\[s94\]\[DIRECT\] init: mode (?:1|2|-1)'] }]
