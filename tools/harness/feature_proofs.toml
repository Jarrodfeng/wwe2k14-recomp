cvar = "gpu_quirks_mobile_no_gs"
on = ["true", "1"]
requires = ["S93_gpu_quirks"]
proofs = [{ what = "the three geometry-shader switches were set by the rule (phone class only; Session 94: on by default, so a desktop / iGPU class line counts as 'not applicable'; on a desktop class nothing is set, so use vulkan_emulate_gpu with a phone GPU)", any = ['\[quirks\] mobile_no_gs: vulkan_force_expand_rectangle_lists_in_vs=true', '\[quirks\] GPU .+ class (?:desktop|igpu|cpu)'] }]

[[feature]]
name = "S93_quirks_advisory"
cvar = "gpu_quirks_advisory"
on = ["true", "1"]
requires = ["S93_gpu_quirks"]
proofs = [{ what = "an advisory rule applied (Qualcomm / Turnip: one pipeline compile thread; needs vulkan_emulate_gpu on the PC)", any = ['\[quirks\] qcom_pipeline_threads: vulkan_pipeline_creation_threads=1 \('] }]

[[feature]]
name = "S93_robust_buffer_access_off"
cvar = "vulkan_robust_buffer_access"
on = ["false", "0"]
proofs = [{ what = "robustBufferAccess left off at device creation", any = ['\* robustBufferAccess left off \(vulkan_robust_buffer_access=false\)'] }]

[[feature]]
