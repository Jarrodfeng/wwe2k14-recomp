# Session 92: the proof table. One [[feature]] per switch (or per bit of a bit-mask switch): what value means "on",
# and which log lines PROVE it engaged at run time (the `modified: X = 'Y'` line only proves the value was set).
# Read by tools\harness\feature_proof.py (used by tools\native\owned_check.ps1 and tools\census). ADD AN ENTRY WHEN A
# SWITCH IS ADDED: the checker lists every switch a run set (with the prefixes in [meta]) that has no entry.
#
#   name      the label printed (unique; `requires` names these)
#   cvar      the switch name (as in the `modified:` line / --cvar=value)
#   on        values that mean on (strings, compared case-insensitively)       } use `bit` instead of `on` for a bit-mask
#   bit       a bit of an integer switch: on when (value & bit) != 0             } switch (gpu_d3d_owned_front)
#   requires  other feature names that must be PROVEN in the same run (host queue first)
#   proofs    ALL must pass. Each is { what, any = [regex, ...], gt = N }:
#             the proof passes when ANY regex matches a log line; if a regex has a capture group 1 the number must be
#             > gt (default 0) on at least one line (the largest over the log is printed). No group = a match is enough.
#
# Source of each line: the S92 logs of 2026-11-05 (the exact text, see the builder hand-back).

[meta]
# switches with these prefixes that a run sets and that have NO entry are listed (never fail a run): the table must grow
watch_prefixes = ["gpu_d3d_", "wwe2k14_d3d_", "gpu_native_owned", "render_target_path", "vulkan_shared_memory", "vulkan_emulate_limits", "vulkan_emulate_no_bc", "vulkan_texture_transcode"]

[[feature]]
name = "d3d_owned"
cvar = "wwe2k14_d3d_owned"
on = ["true", "1"]
proofs = [
  { what = "the D3D-layer stack on", any = ['\[d3d_owned\] the D3D-layer stack on'] },
  { what = "host queue attached", any = ['\[d3d\]\[noring\] host queue attached'] },
]

# Session 92 M6 (piece C; the SDK piece A/B log line texts are ASSUMED from docs/native/d3d/S92_M6_DESIGN.md section 3: the
# `[m6][store]` line at store open, `store hits N` in the `[d3d][free]` windows - check the regexes against the first run).
[[feature]]
name = "M6_store"
cvar = "gpu_m6_store"
on = ["true", "1"]
requires = ["d3d_owned"]
proofs = [
  { what = "the translation store opened", any = ['\[m6\]\[store\] .+: \d+ translations'] },
  { what = "the store counted (hits or first-sight misses: a check exe's new GPU module starts an empty store, Session 93)", any = ['store hits \d+', '\[m6\]\[miss\] '] },
]

