  { what = "repeats drawn by RepeatDrawFast over the typed constants", any = ['tried \d+, repeated (\d+) \(RepeatDrawFast\)'] },
]

# (the window line prints only with the memo or the repeat on: the timers switch is proved by its own word in that line)
[[feature]]
name = "S93_typed_timers_off"
cvar = "gpu_d3d_typed_timers"
on = ["false", "0"]
proofs = [{ what = "the typed clocks are off (the figures of the M4f-A line print 0)", any = ['timers off', 'whole typed draw 0\.0 us a frame'] }]

# Session 93 (idea 2, SDK branch s93-astc): BC textures on GPUs without BC. Lines from texture_cache.cpp Initialize ("[tex][transcode] DXT1 -> ASTC_4x4 (BC missing,
# ASTC_4x4 sampled+filter yes)", or "-> RGBA8 (BC missing, no target: ...)" when the GPU lacks the target) and EndFrame (every 600 frames while anything was transcoded:
# "[tex][transcode] last 600 frames: blocks DXT1->ASTC N (L loads), ..."). On the PC (BC present, ASTC / ETC2 absent) only the cvar pair with vulkan_emulate_no_bc can be
# proved, and only the selection line: the transcode itself needs a GPU with ASTC / EAC (Mali, Adreno); there add the proof 'last 600 frames: blocks DXT1->ASTC (\d+)' (not required here: the PC cannot print it).
[[feature]]
name = "S93_emulate_no_bc"
cvar = "vulkan_emulate_no_bc"
on = ["true", "1"]
proofs = [{ what = "BC1 treated as missing (the selection line says emulated)", any = ['\[tex\]\[transcode\] DXT1 -> .* \(BC missing \[emulated\]'] }]

[[feature]]
name = "S93_texture_transcode"
cvar = "vulkan_texture_transcode"
on = ["true", "1"]
requires = ["S93_emulate_no_bc"]
proofs = [
  { what = "the transcode target was probed and the choice logged (ASTC if supported, else the RGBA8 fallback with the reason)", any = ['\[tex\]\[transcode\] DXT1 -> (?:ASTC_4x4 \(BC missing.*sampled\+filter yes, chosen by vulkan_texture_transcode\)|RGBA8 \(BC missing.*no target: ASTC_4x4 sampled\+filter no\))'] },
]

# Session 93 (idea 6, SDK branch s93-quirks): the driver quirks table (src/ui/vulkan/gpu_quirks*.cpp). Lines printed at device creation: the header
# "[quirks] GPU <name> vendor 0x.... driver id=N (NAME) <version> class phone|igpu|desktop|cpu", then one "[quirks] <rule>: <switch>=<value> (<reason>)" per applied rule
# ("... NOT APPLIED (<why>) ..." when held back; "[quirks] <rule>: info (...)" for log-only ones). Texts are from gpu_quirks_apply.cpp / gpu_quirks.cpp.
[[feature]]
name = "S93_gpu_quirks"
cvar = "gpu_quirks"
on = ["true", "1"]
proofs = [
  { what = "the GPU was detected and classed (header line)", any = ['\[quirks\] GPU .+ vendor 0x[0-9A-Fa-f]{4} driver id=\d+ \(\w+\) .+ class (?:phone|igpu|desktop|cpu)'] },
  { what = "the rules were evaluated with the master switch on (the master line says gpu_quirks=true)", any = ['\[quirks\] master gpu_quirks=true'] },
]

[[feature]]
name = "S93_gpu_quirks_off"
cvar = "gpu_quirks"
on = ["false", "0"]
proofs = [{ what = "detection + log only: the master line says gpu_quirks=false and rules print NOT APPLIED (gpu_quirks=false) or info only", any = ['\[quirks\] master gpu_quirks=false'] }]

[[feature]]
name = "S93_emulate_gpu"
cvar = "vulkan_emulate_gpu"
# the "on" test is an exact value match: these are the two specs the session-93 checks use (any other spec: add its exact string here)
on = ["5143:512.800.55:Adreno (TM) 830", "13B5:r49p1:Mali-G715:integrated"]
proofs = [{ what = "the table saw the emulated GPU", any = ['\[quirks\] vulkan_emulate_gpu: the table sees'] }]

[[feature]]
