# Session 7, frame pacing Step 0 (docs/systems/frame_pacing.md "Safe experiment for 60 fps entrances"):
# LOG ONLY, no behaviour change. Hook functions live in src/pacing_hooks.h. None of these hooks returns a value, so
# none can return or jump: the guest code runs exactly as before.
#
# Addresses: db/frame_pacing.json (static reading, Session 6), each re-checked in Session 7 against the generated
# code with tools/analysis/list_function.py. The call-site list was re-derived by scanning every generated function
# for a branch to 0x82BB6D50 (halve) or 0x82BB6DF0 (restore): 9 + 15 sites, all `bl`, no tail-call `b`, no other
# branch form; identical to the db's lists. Nothing branches directly to 0x82CAA838.
#
# A hook runs before the instruction at its address (after_instruction defaults to false), and also when code jumps
# to that address (the hook is emitted after the label).

# ---------------------------------------------------------------------------------------------------------------
# End of frame, sub_82BA84E8 (called only by the render command thread sub_82BB5CC0), at the compare of the cached
# frame-rate word with the current one. Both present paths (0x82BA855C jumps to 0x82BA85D8; the other path falls
# through from the present call at 0x82BA85D4) reach it, so it runs once per presented frame. Before this instruction
# executes: r9 = engine object +472 (the copy of the word from the last change, loaded at 0x82BA85DC) and
# r10 = the frame-rate word at 0x8392DC40 (timing block base 0x8392DC38 built at 0x82BA85D8/0x82BA85E0, +8 loaded
# at 0x82BA85E4). The function returns early at 0x82BA8500 (engine +308 == 0) without reaching this point.
[[midasm_hook]]
address = 0x82BA85E8
name = "wwe2k14_pacing_fps_word"
registers = ["r9", "r10"]

# ---------------------------------------------------------------------------------------------------------------
# Late-frame threshold setter sub_82CAA838 (row 95 of the render-state table at 0x8362EFB0; no direct caller), at its
# first instruction: r3 = D3D device, r4 = new threshold (the low 7 bits go to bits 23-29 of device+12284).
# Reached only through a pointer (the device reset sub_82CC0150 walks the table) or not at all.
[[midasm_hook]]
address = 0x82CAA838
name = "wwe2k14_pacing_threshold"
registers = ["r3", "r4"]

