#   0x83438A50 reloads exactly that layout; its caller sub_82CCD908 ends right after `bl 0x83438a50` (no epilogue).
#   The Lettering crash: sub_82CCD908 returned with r1 moved up 0x260 and r31 = 0, which is the setjmp frame's state.
